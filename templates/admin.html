<!DOCTYPE html>
<html lang='ar' dir='rtl'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>لوحة التحكم | كرنفال</title>
    <script src='https://cdn.tailwindcss.com'></script>
    <link href='https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap' rel='stylesheet'>
    <style>body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; color: #f3f4f6; }</style>
</head>
<body class='min-h-screen flex flex-col justify-between'>
    <header class='border-b border-amber-500/20 bg-[#111827] px-6 h-20 flex items-center justify-between shadow-xl'>
        <span class='text-lg font-black text-amber-400'>⚙️ لوحة تحكم متجر كرنفال</span>
        <a href='/' class='text-xs bg-gray-800 hover:bg-gray-700 text-amber-400 px-3 py-2 rounded-xl font-bold border border-amber-500/30'>عرض المتجر ←</a>
    </header>

    <main class='max-w-4xl mx-auto px-4 py-8 w-full'>
        <div class='bg-[#111827] border border-amber-500/30 rounded-3xl p-6 mb-8 shadow-xl'>
            <h3 class='text-amber-400 font-bold text-sm mb-2'>📱 رقم واتساب استقبال الطلبات</h3>
            <form method='POST' class='flex gap-3'>
                <input type='hidden' name='action' value='update_whatsapp'>
                <input type='text' name='whatsapp' value='{{ data.whatsapp }}' required class='flex-1 bg-[#0b0f19] border border-amber-500/30 rounded-xl p-2.5 text-xs text-white'>
                <button type='submit' class='px-5 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs'>حفظ الرقم</button>
            </form>
        </div>

        <div class='bg-[#111827] border border-amber-500/30 rounded-3xl p-6 mb-8 shadow-xl'>
            <h3 class='text-amber-400 font-bold text-sm mb-4'>➕ إضافة منتج جديد</h3>
            <form method='POST' class='grid grid-cols-1 sm:grid-cols-2 gap-4'>
                <input type='hidden' name='action' value='add_product'>
                <div>
                    <label class='block text-xs text-gray-300 mb-1'>اسم المنتج:</label>
                    <input type='text' name='name' required class='w-full bg-[#0b0f19] border border-amber-500/30 rounded-xl p-2.5 text-xs text-white'>
                </div>
                <div>
                    <label class='block text-xs text-gray-300 mb-1'>السعر:</label>
                    <input type='text' name='price' required placeholder='مثال: 25,000 د.ع' class='w-full bg-[#0b0f19] border border-amber-500/30 rounded-xl p-2.5 text-xs text-white'>
                </div>
                <div>
                    <label class='block text-xs text-gray-300 mb-1'>النوع / التصنيف:</label>
                    <input type='text' name='type' required class='w-full bg-[#0b0f19] border border-amber-500/30 rounded-xl p-2.5 text-xs text-white'>
                </div>
                <div>
                    <label class='block text-xs text-gray-300 mb-1'>رابط الصورة (URL):</label>
                    <input type='url' name='image' class='w-full bg-[#0b0f19] border border-amber-500/30 rounded-xl p-2.5 text-xs text-white'>
                </div>
                <div class='sm:col-span-2'>
                    <button type='submit' class='w-full py-3 rounded-xl bg-gradient-to-r from-red-800 to-amber-600 text-white font-bold text-xs'>نشر المنتج في المتجر ⚡</button>
                </div>
            </form>
        </div>

        <h3 class='text-amber-400 font-bold text-sm mb-4'>📦 المنتجات المعروضة</h3>
        <div class='grid grid-cols-1 sm:grid-cols-2 gap-4'>
            {% for p in data.products %}
            <div class='bg-[#111827] border border-amber-500/20 rounded-2xl p-4 flex items-center justify-between shadow-xl'>
                <div class='flex items-center gap-3'>
                    <img src='{{ p.image }}' class='w-12 h-12 rounded-xl object-cover border border-amber-500/30'>
                    <div>
                        <h4 class='text-white font-bold text-xs'>{{ p.name }}</h4>
                        <p class='text-amber-400 text-xs'>{{ p.price }} - {{ p.type }}</p>
                    </div>
                </div>
                <form method='POST'>
                    <input type='hidden' name='action' value='delete_product'>
                    <input type='hidden' name='id' value='{{ p.id }}'>
                    <button type='submit' class='px-3 py-1.5 rounded-lg bg-red-600 text-white text-[11px] font-bold'>حذف</button>
                </form>
            </div>
            {% endfor %}
        </div>
    </main>

    <footer class='text-center py-6 text-xs text-gray-500 border-t border-gray-900 mt-10'>
        CARNIVAL Store Admin © 2026 - إدارة أبو سليم
    </footer>
</body>
</html>
