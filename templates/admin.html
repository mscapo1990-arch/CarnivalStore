<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | كرنفال</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4">
    <div class="max-w-md mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-amber-400">⚙️ لوحة التحكم</h1>
            <div class="flex gap-2">
                <a href="/" target="_blank" class="bg-slate-800 text-amber-400 px-3 py-1.5 rounded-lg text-xs font-bold border border-slate-700">عرض المتجر</a>
                <a href="/logout" class="bg-red-600/20 text-red-400 px-3 py-1.5 rounded-lg text-xs font-bold border border-red-500/30">خروج</a>
            </div>
        </div>

        <!-- تحديث الواتساب -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-6">
            <h2 class="text-sm font-semibold mb-3">📱 رقم واتساب استقبال الطلبات</h2>
            <form action="/admin" method="POST" class="flex gap-2">
                <input type="hidden" name="action" value="update_whatsapp">
                <input type="text" name="whatsapp" value="{{ store_data.whatsapp }}" required class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm flex-1 text-white">
                <button type="submit" class="bg-amber-500 text-slate-900 px-4 py-2 rounded-lg font-bold text-xs whitespace-nowrap">حفظ الرقم</button>
            </form>
        </div>

        <!-- إضافة منتج جديد -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
            <h2 class="text-sm font-semibold mb-3">➕ إضافة منتج جديد</h2>
            <form action="/admin" method="POST" enctype="multipart/form-data" class="space-y-3">
                <input type="hidden" name="action" value="add_product">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">اسم المنتج:</label>
                    <input type="text" name="name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">السعر:</label>
                    <input type="text" name="price" placeholder="مثال: 25,000 د.ع" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">القسم:</label>
                    <select name="category" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                        <option value="رجالي">رجالي</option>
                        <option value="نسائية">نسائية</option>
                        <option value="أطفال">أطفال</option>
                        <option value="أحذية">أحذية</option>
                        <option value="منتجات أخرى">منتجات أخرى</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">صورة المنتج (من الهاتف):</label>
                    <input type="file" name="image" accept="image/*" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-300">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">تفاصيل إضافية:</label>
                    <input type="text" name="desc" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 text-slate-900 py-2.5 rounded-lg font-bold text-sm mt-2">نشر المنتج في المتجر ⚡</button>
            </form>
        </div>
    </div>

<!-- Kayan Admin Controls Patch -->
<div id="kayan-admin-tools" style="margin-top:16px;padding:12px;border:1px dashed #f59e0b;border-radius:10px;">
  <div style="font-size:13px;color:#fbbf24;margin-bottom:8px;">أدوات الإدارة السريعة (متوفر / تم البيع - تعديل - حذف - الصور)</div>
  <form method="POST" action="/toggle_status/1" style="display:inline-block;margin:4px;">
    <select name="status" style="padding:6px;border-radius:6px;">
      <option value="متوفر">متوفر</option>
      <option value="تم البيع">تم البيع</option>
    </select>
    <button type="submit" style="padding:6px 10px;border-radius:6px;cursor:pointer;">تحديث الحالة</button>
  </form>
  <form method="POST" action="/delete_product/1" style="display:inline-block;margin:4px;">
    <button type="submit" style="padding:6px 10px;border-radius:6px;cursor:pointer;">حذف منتج</button>
  </form>
</div>


<div id="kayan-quick-bar" style="margin-top:14px;padding:10px;border-radius:10px;border:1px solid #334155;background:#1e293b;display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
  <form method="POST" action="/toggle_status/1" style="margin:0;">
    <button type="submit" style="padding:7px 12px;border-radius:8px;border:none;background:#10b981;color:#fff;font-weight:bold;cursor:pointer;">تبديل متوفر / تم البيع</button>
  </form>
  <form method="POST" action="/delete_product/1" style="margin:0;" onsubmit="return confirm('تأكيد الحذف؟');">
    <button type="submit" style="padding:7px 12px;border-radius:8px;border:none;background:#ef4444;color:#fff;font-weight:bold;cursor:pointer;">حذف منتج</button>
  </form>
</div>

</body>
</html>
