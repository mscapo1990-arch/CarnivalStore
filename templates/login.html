<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الإدارة | كرنفال</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 w-full max-w-sm">
        <h1 class="text-xl font-bold text-amber-400 mb-2 text-center">🔐 لوحة تحكم كرنفال</h1>
        <p class="text-xs text-slate-400 text-center mb-6">يرجى تسجيل الدخول للمتابعة</p>
        
        {% if error %}
        <div class="bg-red-500/10 border border-red-500 text-red-400 text-xs p-3 rounded-lg mb-4 text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs text-slate-300 mb-1">اسم المستخدم:</label>
                <input type="text" name="username" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
            </div>
            <div>
                <label class="block text-xs text-slate-300 mb-1">كلمة المرور:</label>
                <input type="password" name="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
            </div>
            <button type="submit" class="w-full bg-amber-500 text-slate-900 py-2.5 rounded-lg font-bold text-sm mt-2">دخول الإدارة ⚡</button>
        </form>
        <div class="text-center mt-4">
            <a href="/" class="text-xs text-slate-400 hover:text-amber-400">← العودة إلى المتجر الرئيسي</a>
        </div>
    </div>
</body>
</html>
